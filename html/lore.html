  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <nav class="sb-nav">
      <a href="personagens.html" class="sb-link">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 5 5 5 9v4l-1 2h16l-1-2V9c0-4-3-7-7-7z"/><path d="M9 15v2a3 3 0 0 0 6 0v-2"/><path d="M8 9h8"/></svg></span>
        <span class="sb-label">PERSONAGENS</span>
      </a>
      <a href="missoes.html" class="sb-link">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V6z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>
        <span class="sb-label">MISSÕES</span>

      <a href="classes.html" class="sb-link">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="3" x2="21" y2="21"/><line x1="21" y1="3" x2="3" y2="21"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span class="sb-label">CLASSES</span>
      </a>
      <a href="joga.html" class="sb-link">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="12,2 15,9 12,12 9,9" fill="currentColor" opacity="0.7"/><polygon points="12,22 9,15 12,12 15,15" fill="currentColor" opacity="0.3"/></svg></span>
        <span class="sb-label">MAPA</span>
      </a>
      <a href="lore.html" class="sb-link active">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h9v16H2z"/><path d="M13 4h9v16h-9z"/><line x1="11" y1="4" x2="13" y2="4"/><line x1="11" y1="20" x2="13" y2="20"/></svg></span>
        <span class="sb-label">LORE</span>
      </a>
      <a href="mercado.html" class="sb-link">
        <span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,2 19,7 19,17 12,22 5,17 5,7"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>
        <span class="sb-label">MERCADO</span>
      </a>
    </nav>
    <div class="sb-bottom">
      <div class="sb-dragon">
        <img src="../assets/images/dragao_emblema.png" alt="Dragão" style="width:120px;height:120px;object-fit:contain;" />
      </div>
      <div class="sb-divider"></div>
      <a href="configuracoes.html" class="sb-link sb-link-sm">
        <span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></span>
        <span class="sb-label">CONFIGURAÇÕES</span>
      </a>
      <a href="../index.html" class="sb-link sb-link-sm sb-link-danger">
        <span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
        <span class="sb-label">DESLIGAR</span>
      </a>

  <!-- MAIN -->
  <div class="main-wrap">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="topbar-hamburger" onclick="document.getElementById('sidebar').classList.toggle('sb-open')">☰</button>
      <a href="../home.html" class="topbar-back" title="Voltar à Jornada">← JORNADA</a>
      <div class="topbar-right">
        <button class="topbar-icon-btn">
          🔔<span class="topbar-badge">3</span>
          <div class="topbar-drop">
            <div class="drop-title">Notificações</div>
            <div class="drop-item">⚔ Nova missão disponível</div>
            <div class="drop-item">🏆 Conquista desbloqueada!</div>
            <div class="drop-item">📜 Mensagem da Guilda</div>
          </div>
        </button>
        <button class="topbar-icon-btn">
          ✉<span class="topbar-badge topbar-badge-red">2</span>
          <div class="topbar-drop">
            <div class="drop-title">Mensagens</div>
            <div class="drop-item">🧙 Harley: "Pronto para a batalha?"</div>
            <div class="drop-item">⚔ Morgan: "Encontrei uma relíquia!"</div>
          </div>
        </button>
        <div class="topbar-profile-wrap">
          <button class="topbar-profile-btn">
            <div class="topbar-avatar" id="topbar-avatar">K</div>
            <div class="topbar-profile-info">
              <span class="topbar-profile-name" id="topbar-name">Kael</span>
              <span class="topbar-profile-level">Nv. <span id="topbar-level">8</span></span>
            </div>
            <span class="topbar-arrow">▾</span>
          </button>
          <div class="topbar-drop topbar-profile-drop">
            <button onclick="window.location.href='../index.html'">⏻ Sair</button>
          </div>
        </div>
      </div>
    </header>

    <!-- LORE AREA -->
    <div class="lore-area">

      <!-- MENU LATERAL DA LORE -->
      <div class="lore-menu">
        <div class="lore-menu-title">
          <span class="lore-menu-rune">✦</span>
          GRIMÓRIO
          <span class="lore-menu-rune">✦</span>
        </div>
        <div class="lore-menu-list" id="lore-menu-list">
          <button class="lore-menu-item active" data-chapter="visao" onclick="Lore.openChapter('visao', this)">
            <span class="lore-menu-icon">🌍</span>
            <span class="lore-menu-label">VISÃO GERAL</span>
          </button>
          <button class="lore-menu-item" data-chapter="reinos" onclick="Lore.openChapter('reinos', this)">
            <span class="lore-menu-icon">🏰</span>
            <span class="lore-menu-label">REINOS</span>
          </button>
          <button class="lore-menu-item" data-chapter="faccoes" onclick="Lore.openChapter('faccoes', this)">
            <span class="lore-menu-icon">⚜</span>
            <span class="lore-menu-label">FACÇÕES</span>
          </button>
          <button class="lore-menu-item" data-chapter="personagens" onclick="Lore.openChapter('personagens', this)">
            <span class="lore-menu-icon">✥</span>
            <span class="lore-menu-label">PERSONAGENS</span>
          </button>
          <button class="lore-menu-item" data-chapter="eventos" onclick="Lore.openChapter('eventos', this)">
            <span class="lore-menu-icon">⚡</span>
            <span class="lore-menu-label">EVENTOS</span>
          </button>
          <button class="lore-menu-item" data-chapter="bestiario" onclick="Lore.openChapter('bestiario', this)">
            <span class="lore-menu-icon">🐉</span>
            <span class="lore-menu-label">BESTIÁRIO</span>
          </button>
          <button class="lore-menu-item" data-chapter="reliquias" onclick="Lore.openChapter('reliquias', this)">
            <span class="lore-menu-icon">💎</span>
            <span class="lore-menu-label">RELÍQUIAS</span>
          </button>
        </div>

        <div class="lore-progress-wrap">
          <div class="lore-progress-label">LORE DESCOBERTA</div>
          <div class="lore-progress-bar">
            <div class="lore-progress-fill" id="lore-progress-fill"></div>
          </div>
          <div class="lore-progress-pct" id="lore-progress-pct">0%</div>
        </div>
      </div>

      <!-- LIVRO -->
      <div class="book-wrap" id="book-wrap">

        <div class="dust-particles" id="dust-particles"></div>

        <div class="book" id="book">

          <div class="book-spine"></div>

          <!-- PÁGINA ESQUERDA -->
          <div class="book-page page-left" id="page-left">
            <div class="page-inner" id="page-left-inner"></div>
            <div class="corner-ornament corner-tl">❧</div>
            <div class="corner-ornament corner-bl">❧</div>
            <div class="page-number" id="page-num-left">I</div>
          </div>

          <!-- ANIMAÇÃO DE VIRAR PÁGINA -->
          <div class="page-flip" id="page-flip">
            <div class="page-flip-front" id="page-flip-front"></div>
            <div class="page-flip-back"  id="page-flip-back"></div>
          </div>

          <!-- PÁGINA DIREITA -->
          <div class="book-page page-right" id="page-right">
            <div class="page-inner" id="page-right-inner"></div>
            <div class="corner-ornament corner-tr">❧</div>
            <div class="corner-ornament corner-br">❧</div>
            <div class="page-number" id="page-num-right">II</div>
          </div>

        </div>

        <!-- CONTROLES DE NAVEGAÇÃO -->
        <div class="book-nav">
          <button class="book-nav-btn" id="btn-prev" onclick="Lore.prevPage()">
            <span class="nav-arrow">◀</span>
            <span class="nav-label">ANTERIOR</span>
          </button>
          <div class="book-nav-info">
            <span class="book-chapter-name" id="book-chapter-name">VISÃO GERAL</span>
            <span class="book-page-info" id="book-page-info">Página 1 de 1</span>
          </div>
          <button class="book-nav-btn" id="btn-next" onclick="Lore.nextPage()">
            <span class="nav-label">PRÓXIMA</span>
            <span class="nav-arrow">▶</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/lore.js"></script>
</body>
</html>
